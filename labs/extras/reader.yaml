apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: kube-book
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: kube-book
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: kube-book
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: kube-book
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader

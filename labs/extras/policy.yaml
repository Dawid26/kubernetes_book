apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: page-ingress
  namespace: kube-book
spec:
  podSelector:
    matchLabels:
      app: status-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: status-web
      ports:
        - protocol: TCP
          port: 8080

apiVersion: v1
kind: Pod
metadata:
  name: notebook
  namespace: kube-book
  labels:
    app: notebook
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 1000
  containers:
    - name: shell
      image: busybox:1.36.1
      command:
        - sleep
        - '86400'
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: notebook

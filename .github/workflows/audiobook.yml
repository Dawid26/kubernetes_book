name: Build English audiobook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/narration.md'
      - 'audio/render.py'
permissions:
  contents: write
concurrency:
  group: english-audiobook
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the speech engine
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg espeak-ng
          python -m pip install 'kokoro-onnx==0.4.9' 'soundfile==0.13.1'
      - name: Download and verify the release model
        run: |
          model_url='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1'
          curl -fsSL --retry 3 "$model_url/kokoro-v1.0.onnx" -o "$RUNNER_TEMP/kokoro-v1.0.onnx"
          curl -fsSL --retry 3 "$model_url/voices-v1.0.bin" -o "$RUNNER_TEMP/voices-v1.0.bin"
          cd "$RUNNER_TEMP"
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin' | sha256sum -c -
      - name: Narrate and check all chapters
        run: python audio/render.py "$RUNNER_TEMP"
      - name: Save the listening edition
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-in-practice-english
          path: |
            audio/kubernetes-in-practice-en.mp3
            audio/chapters.md
      - name: Publish audio and chapter times
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/kubernetes-in-practice-en.mp3 audio/chapters.md
          if ! git diff --cached --quiet; then
            git commit -m 'Render the English listening edition'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
